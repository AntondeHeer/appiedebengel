<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Appie en het Geheim van de Kerststol – Luisterboek</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#07162b;color:#fff;font-family:Georgia,serif;overflow:hidden}
.scene{position:absolute;inset:0}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.1s ease;background:#07162b}
.scene img.active{opacity:1}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 72%,rgba(0,0,0,.58));pointer-events:none}
.start{position:absolute;bottom:11%;left:50%;transform:translateX(-50%);background:linear-gradient(#9b2424,#631010);color:#ffe8a7;border:2px solid #e6b75b;border-radius:28px;font:700 clamp(17px,2.6vw,26px) Georgia;padding:15px 30px;cursor:pointer;box-shadow:0 5px 25px #000b;white-space:nowrap}
.controls{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:#09172cce;border:1px solid #cba86c88;border-radius:25px;max-width:96%;padding:8px 15px;font-size:14px}
.controls button{background:none;color:white;border:0;font-size:22px;cursor:pointer}
.controls input{width:min(35vw,280px);accent-color:#f6c56c}
.note{position:absolute;top:12px;left:12px;background:#0009;padding:7px 11px;border-radius:8px;font-size:13px}
.done{position:absolute;bottom:15%;width:100%;text-align:center;font-size:clamp(18px,3vw,30px);text-shadow:0 2px 9px black;display:none}
@media(max-width:650px){.controls{font-size:11px;gap:5px}.controls input{width:23vw}.note{font-size:11px}}
</style>
</head>
<body>
<div class="scene" id="scene">
<img src="beeld1.jpg" alt="Beeld 1" class="active">
<img src="beeld2.jpg" alt="Beeld 2">
<img src="beeld3.jpg" alt="Beeld 3">
<img src="beeld4.jpg" alt="Beeld 4">
<img src="beeld5.jpg" alt="Beeld 5">
<img src="beeld6.png" alt="Beeld 6">

<img src="beeld15.png" alt="Beeld 15">

<img src="beeld17.png" alt="Beeld 17">
<img src="beeld18.png" alt="Beeld 18">
<img src="beeld19.png" alt="Beeld 19">
<img src="beeld20.png" alt="Beeld 20">
<img src="beeld21.png" alt="Beeld 21">
<img src="beeld22.png" alt="Beeld 22">
<img src="beeld23.png" alt="Beeld 23">
<img src="beeld24.png" alt="Beeld 24">
<img src="beeld25.png" alt="Beeld 25">
<img src="beeld26.png" alt="Beeld 26">
<img src="beeld27.png" alt="Beeld 27">
<img src="beeld28.png" alt="Beeld 28">
<img src="beeld29.png" alt="Beeld 29">
<img src="beeld30.png" alt="Beeld 30">
<img src="beeld31.png" alt="Beeld 31">
<img src="beeld32.png" alt="Beeld 32">
<img src="beeld33.png" alt="Beeld 33">
<img src="beeld34.png" alt="Beeld 34">
<img src="beeld35.png" alt="Beeld 35">
<img src="beeld36.png" alt="Beeld 36">
<img src="beeld37.png" alt="Beeld 37">
<img src="beeld38.png" alt="Beeld 38">

<img src="beeld47.png" alt="Beeld 47">
<img src="beeld48.png" alt="Beeld 48">
</div>
<div class="shade"></div>
<div class="note" id="note">Hoofdstuk 1 · Een koude decemberdag</div>
<button class="start" id="start">▶ Start luisterboek</button>
<div class="controls" id="controls">
<button id="toggle" aria-label="Afspelen of pauzeren">⏸</button>
<span id="clock">0:00</span>
<input id="seek" type="range" min="0" max="42" step="0.05" value="0" aria-label="Voortgang">
<span id="duration">0:42</span>
<button id="again" title="Hoofdstuk opnieuw">↺</button>
</div>
<div class="done" id="done"></div>
<audio id="voice" preload="auto" src="hoofdstuk1.mp3"></audio>
<script>
// Afbeeldingsnummers zijn hier 1-gebaseerd: beeld34 is dus letterlijk nummer 34.
const chapters=[
 {title:'Hoofdstuk 1 · Een koude decemberdag',audio:'hoofdstuk1.mp3',images:[1,2,3,4,5],cuts:[0,4.5,16.8,26.3,34.0],relative:false},
 {title:'Hoofdstuk 2 · Voor de bakkerij',audio:'Hoofdstuk 2.mp3',images:[6,7,8,9],cuts:[0,.28,.55,.79],relative:true},
 {title:'Hoofdstuk 3 · Avontuur in de haven',audio:'Hoofdstuk 3.mp3',images:[10,11,12,13],cuts:[0,.38,.62,.79],relative:true},
 {title:'Hoofdstuk 4 · Paniek op de markt',audio:'Hoofdstuk 4.mp3',images:[14,15,16,17],cuts:[0,.30,.52,.78],relative:true},
 {title:'Hoofdstuk 5 · Muizen in de kaashandel',audio:'Hoofdstuk 5.mp3',images:[18,19,20],cuts:[0,.34,.68],relative:true},
 {title:'Hoofdstuk 6 · Verwarring in het pakhuis',audio:'Hoofdstuk 6.mp3',images:[21,22,23,24],cuts:[0,.25,.50,.75],relative:true},
 {title:'Hoofdstuk 7 · Een vreemd goedje in de molen',audio:'Hoofdstuk 7.mp3',images:[25,26,27,28],cuts:[0,.25,.50,.75],relative:true},
 {title:'Hoofdstuk 8 · Drukte in de winkel',audio:'Hoofdstuk 8.mp3',images:[29,30,31,32,33,34],cuts:[0,.20,.40,.60,.80,.92],relative:true},
 {title:'Hoofdstuk 9 · Een bijzondere ontdekking',audio:'Hoofdstuk 9.mp3',images:[34,35,36,37,38,39],cuts:[0,1/6,2/6,3/6,4/6,5/6],relative:true},
 {title:'Hoofdstuk 10 · Het geheim van de kerststol',audio:'Hoofdstuk 10.mp3',images:[40,41,42],cuts:[0,1/3,2/3],relative:true},
 {title:'Hoofdstuk 11 · Het mooiste kerstfeest',audio:'Hoofdstuk 11.mp3',images:[43,44,45,46,47],cuts:[0,.20,.40,.60,.80],relative:true}
];
const voice=document.getElementById('voice');
const imgs=[...document.querySelectorAll('.scene img')];
const start=document.getElementById('start');
const controls=document.getElementById('controls');
const toggle=document.getElementById('toggle');
const seek=document.getElementById('seek');
const clock=document.getElementById('clock');
const done=document.getElementById('done');
const duration=document.getElementById('duration');
const note=document.getElementById('note');
let chapter=0,finished=false,currentImage=1;
function fmt(t){if(!Number.isFinite(t))return '0:00';return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function showImage(number){
 if(number===currentImage && imgs[number-1]?.classList.contains('active'))return;
 const next=imgs[number-1];
 if(!next)return;
 // Behoud hetzelfde DOM-element voor beeld 34 bij overgang hoofdstuk 8 -> 9.
 // De afbeelding blijft daardoor staan, zonder fade naar zwart.
 next.classList.add('active');
 imgs.forEach((im,i)=>{if(i!==number-1)im.classList.remove('active')});
 currentImage=number;
}
function frame(){
 if(finished)return;
 const c=chapters[chapter],t=voice.currentTime||0;
 let idx=0;
 for(let i=0;i<c.cuts.length;i++){
  const cut=c.relative && Number.isFinite(voice.duration) ? c.cuts[i]*voice.duration : c.cuts[i];
  if(t>=cut)idx=i;
 }
 showImage(c.images[Math.min(idx,c.images.length-1)]);
 seek.value=t;clock.textContent=fmt(t);
}
function loadChapter(index,autoplay){
 finished=false;chapter=index;
 const c=chapters[chapter];
 note.textContent=c.title;done.style.display='none';
 // Toon eerst het beginbeeld, nog vóór het nieuwe audiobestand geladen wordt.
 showImage(c.images[0]);
 voice.src=c.audio;voice.load();
 seek.value=0;seek.max=0;clock.textContent='0:00';duration.textContent='0:00';
 if(autoplay)voice.play().catch(()=>{toggle.textContent='▶';done.textContent='Tik op afspelen om verder te luisteren';done.style.display='block'});
}
voice.addEventListener('loadedmetadata',()=>{
 if(Number.isFinite(voice.duration)){seek.max=voice.duration;duration.textContent=fmt(voice.duration);frame()}
});
voice.addEventListener('timeupdate',frame);
voice.addEventListener('ended',()=>{
 if(chapter<chapters.length-1){loadChapter(chapter+1,true)}
 else{
  finished=true;showImage(48);
  note.textContent='Prettige Kerstdagen en een Gelukkig Nieuwjaar!';
  toggle.textContent='▶';done.style.display='none';
 }
});
voice.addEventListener('play',()=>{toggle.textContent='⏸';done.style.display='none'});
voice.addEventListener('pause',()=>toggle.textContent='▶');
voice.addEventListener('error',()=>{
 done.textContent='Audiobestand niet gevonden: '+chapters[chapter].audio;
 done.style.display='block';
});
start.addEventListener('click',()=>{
 voice.play().then(()=>{start.style.display='none';controls.style.display='flex'})
 .catch(()=>alert('Kan hoofdstuk1.mp3 niet afspelen. Controleer de bestandsnaam in GitHub.'));
});
toggle.addEventListener('click',()=>{
 if(finished){loadChapter(0,true);return}
 if(voice.paused)voice.play();else voice.pause();
});
seek.addEventListener('input',()=>{if(finished)return;voice.currentTime=Number(seek.value);frame()});
document.getElementById('again').addEventListener('click',()=>{
 if(finished){loadChapter(0,true);return}
 voice.currentTime=0;voice.play();
});
frame();
</script>
</body>
</html>
