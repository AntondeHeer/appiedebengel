<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appie en het Geheim van de Kerststol</title>
<meta name="robots" content="noindex">
<script>
(function () {
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
  var destination = mobile
    ? 'https://antondeheer.github.io/Appie-kerststol-mobiel/'
    : 'https://antondeheer.github.io/Appie-kerststol/';
  window.location.replace(destination);
})();
</script>
</head>
<body>
<p>Het spel wordt geopend. <a href="https://antondeheer.github.io/Appie-kerststol/">Klik hier als dat niet automatisch gebeurt.</a></p>
</body>
</html>
